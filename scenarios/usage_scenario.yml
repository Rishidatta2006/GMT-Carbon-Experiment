---
name: "Python Carbon Experiment - LOW Workload"
author: "B.Tech Computer Science Student"
description: "Measures energy consumption and carbon emissions of a Python low CPU workload using Green Metrics Tool."

services:
  app-runner:
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["tail", "-f", "/dev/null"]

flow:
  - name: "Baseline Stabilization"
    container: app-runner
    commands:
      - type: console
        command: "sleep 5"
        note: "Allow baseline power measurements to stabilize"

  - name: "Execute LOW Workload"
    container: app-runner
    commands:
      - type: console
        command: "python app/app.py --mode low --duration 30"
        note: "Execute the 30-second LOW CPU workload"